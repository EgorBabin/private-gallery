networks:
  gallery-net:
    driver: bridge

volumes:
  pgdata:
  traefik-letsencrypt:

services:
  traefik:
    image: traefik:v2.11.34
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      DOCKER_HOST: "unix:///var/run/docker.sock"
      DOCKER_API_VERSION: "1.52"
    command:
      - --log.level=DEBUG
      - --api.insecure=true                                  # dashboard
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.email=${LE_EMAIL}
      # staging:
      # - --certificatesresolvers.le.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # dashboard Traefik (insecure)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - gallery-net

  traefik-watcher:
    image: docker:27-cli
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gallery-net
    entrypoint: >
      sh -c '
        while true; do
          CONTAINER=$(docker ps --filter "ancestor=traefik:v2.11.34" --format "{{.Names}}" | head -n1);
          if [ -n "$${CONTAINER}" ]; then
            STATUS=$$(docker inspect --format "{{.State.Health.Status}}" "$${CONTAINER}" 2>/dev/null || echo unknown);
            if [ "$${STATUS}" = "unhealthy" ]; then
              echo "$$(date) - $${CONTAINER} unhealthy -> restarting";
              docker restart "$${CONTAINER}";
              sleep 10;
            fi;
          fi;
          sleep 5;
        done
      '

  postgres:
    image: postgres:18.1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${PG_DATABASE}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - APP_INIT_USERNAME=${APP_INIT_USERNAME}
      - APP_INIT_EMAIL=${APP_INIT_EMAIL}
      - APP_INIT_ROLE=${APP_INIT_ROLE}
      - APP_INIT_PHONE=${APP_INIT_PHONE}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - gallery-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - postgres
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${SERVER_NAME}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=le"
      - "traefik.http.middlewares.strip-api.stripprefix.prefixes=/api"
      - "traefik.http.routers.backend.middlewares=strip-api"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
    networks:
      - gallery-net

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        SERVER_NAME: ${SERVER_NAME:-localhost}
    env_file:
      - .env
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.front.rule=Host(`${SERVER_NAME}`)"
      - "traefik.http.routers.front.entrypoints=websecure"
      - "traefik.http.routers.front.tls.certresolver=le"
      - "traefik.http.services.front.loadbalancer.server.port=80"
    networks:
      - gallery-net