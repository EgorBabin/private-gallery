# Ротация логов Docker: без неё json-логи контейнеров растут бесконечно
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# backend и photo-worker используют один и тот же образ
x-backend: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: private-gallery-backend:latest
  env_file:
    - .env
  restart: unless-stopped
  logging: *default-logging
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - gallery-net

networks:
  gallery-net:
    driver: bridge

volumes:
  pgdata:
  caddy-data:
  caddy-config:

services:
  # HTTPS (Let's Encrypt), статика фронтенда и прокси /api — вместо Traefik + nginx
  caddy:
    build:
      context: .
      dockerfile: ./caddy/Dockerfile
      args:
        VITE_NAME: ${VITE_NAME:-}
        VITE_DOMAIN: ${VITE_DOMAIN:-}
        VITE_PROTOCOL: ${VITE_PROTOCOL:-https://}
        VITE_MAX_UPLOAD_IMAGES: ${VITE_MAX_UPLOAD_IMAGES:-15}
    # Caddy не нужны секреты (БД, S3, токены): только домен, email и адрес S3 для CSP
    environment:
      - SERVER_NAME=${SERVER_NAME}
      - LE_EMAIL=${LE_EMAIL}
      - S3_PUBLIC_ORIGIN=${S3_PUBLIC_ORIGIN:-https:}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - gallery-net

  postgres:
    image: postgres:18.1
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${PG_DATABASE}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - APP_INIT_USERNAME=${APP_INIT_USERNAME}
      - APP_INIT_EMAIL=${APP_INIT_EMAIL}
      - APP_INIT_ROLE=${APP_INIT_ROLE}
      - APP_INIT_TG_ID=${APP_INIT_TG_ID}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - gallery-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${REDIS_MEM_LIMIT:-96m}
    # чистый кэш: ограниченный объём, вытеснение старых ключей, без записи на диск
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-64mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gallery-net

  backend:
    <<: *backend-base
    mem_limit: ${BACKEND_MEM_LIMIT:-768m}

  # фоновые задачи (загрузка, сортировка, удаление) из очереди в PostgreSQL
  photo-worker:
    <<: *backend-base
    command: ["node", "worker.js"]
    # обработка фото не должна забирать весь сервер
    cpus: ${PHOTO_WORKER_CPUS:-1.0}
    mem_limit: ${PHOTO_WORKER_MEM_LIMIT:-768m}
